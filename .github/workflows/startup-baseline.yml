# THROWAWAY diagnostic workflow — delete once the numbers are recorded in
# eng/bench/profiling-notes.md. Not wired into ci.yml or cd.yml, and gated on
# workflow_dispatch only, so it never runs on a push and cannot affect a release.
#
# Question it answers: `claudinine version` spawns in ~11 ms on the maintainer's
# Windows box, which is far above the 1-3 ms usually quoted for Native AOT. Local
# decomposition showed ~9.7 ms of WALL time with 0.00 ms of CPU on both counters —
# the process is blocked, not initializing — and a plain native `where.exe` spawned
# in 47 ms on the same machine. That points at the machine's process-creation path
# (Cortex XDR hooks process creation there), not at AOT. Clean CI runners with no
# endpoint agent give the honest floor, on all six shipped RIDs.
#
# NOTE on workflow_dispatch: it reads the workflow file from the DEFAULT branch, so
# this file must be on main (or whatever default is) before the Actions UI will list
# it. That is the same trap documented for the release workflow.
name: startup-baseline (throwaway)

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Timed spawns per target (after warm-up).'
        required: false
        default: '200'
        type: string

permissions:
  contents: read

jobs:
  baseline:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-arm }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          # Same image constraints as build.yml: macos-13 was retired (a job
          # targeting it queues forever); macos-15-intel is GitHub's last Intel
          # image, kept until ~2027.
          - { rid: osx-x64,     os: macos-15-intel }
          - { rid: osx-arm64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      # The real shipped binary, built exactly as build.yml builds it, so the
      # numbers describe what users actually run.
      - name: Publish (Native AOT)
        working-directory: src
        run: dotnet publish Claudinine/Claudinine.csproj -c Release -r ${{ matrix.rid }} -o ../publish/${{ matrix.rid }}

      # A do-nothing AOT exe and a trivial native exe, for context. Without these
      # the claudinine number is unattributable: it cannot be told apart from the
      # platform's own spawn floor.
      - name: Build comparison baselines
        shell: bash
        run: |
          set -euo pipefail
          # NOT named "nul": that is a reserved DOS device name, and MSBuild fails
          # with MSB1025 (internal command-line error) when the project sits in a
          # directory called nul on Windows. Verified locally — renaming fixes it.
          mkdir -p probe/tinyexe
          cat > probe/tinyexe/Program.cs <<'CS'
          return 0;
          CS
          # Mirror the shipped csproj's publish-relevant properties so the only
          # difference from claudinine is the code, not the codegen or GC config.
          cat > probe/tinyexe/tinyexe.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <PublishAot>true</PublishAot>
              <StripSymbols>true</StripSymbols>
              <TrimmerRemoveSymbols>true</TrimmerRemoveSymbols>
              <OptimizationPreference>Size</OptimizationPreference>
              <InvariantGlobalization>true</InvariantGlobalization>
              <ServerGarbageCollection>false</ServerGarbageCollection>
            </PropertyGroup>
          </Project>
          XML
          dotnet publish probe/tinyexe/tinyexe.csproj -c Release -r ${{ matrix.rid }} -o probe/tinyexe-out
          # Tiny native C exe: the platform's own floor with no managed runtime at
          # all. cc exists on all three OS images (MSVC via the VS shell on Windows
          # is not guaranteed, so Windows falls back to a system exe below).
          if [ "${{ runner.os }}" != "Windows" ]; then
            printf 'int main(void){return 0;}\n' > probe/tiny.c
            # Both non-Windows images ship a compiler (gcc on Ubuntu, clang via the
            # Xcode CLT on macOS). Do not fail the leg if that ever stops being
            # true: the AOT-vs-claudinine comparison is the point, and the harness
            # already prints "(missing)" for a target it cannot find.
            cc -O2 -o probe/tiny-native probe/tiny.c || echo "cc unavailable — skipping native-c baseline"
          fi

      # One harness, all targets, self-contained: spawn N times, report min /
      # median / p90 wall, plus the child's own CPU where the OS exposes it.
      # Written in C# so the timing loop is identical on every platform — a bash
      # or pwsh loop would add per-iteration shell cost that differs by OS and
      # would swamp a 1-3 ms signal (measured locally: Git Bash adds ~15 ms/spawn).
      - name: Build spawn harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/spawn
          cat > probe/spawn/spawn.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <InvariantGlobalization>true</InvariantGlobalization>
            </PropertyGroup>
          </Project>
          XML
          cat > probe/spawn/Program.cs <<'CS'
          using System.Diagnostics;
          using System.Globalization;

          // argv: <runs> then one or more "label=path[::arg]" targets.
          int runs = int.Parse(args[0], CultureInfo.InvariantCulture);
          const int Warmup = 20;

          Console.WriteLine($"{"target",-22} {"min",8} {"median",8} {"p90",8} {"cpu",8}");
          foreach (string spec in args.Skip(1))
          {
              int eq = spec.IndexOf('=');
              string label = spec[..eq];
              string rest = spec[(eq + 1)..];
              int sep = rest.IndexOf("::", StringComparison.Ordinal);
              string exe = sep < 0 ? rest : rest[..sep];
              string? arg = sep < 0 ? null : rest[(sep + 2)..];
              if (!File.Exists(exe)) { Console.WriteLine($"{label,-22} (missing)"); continue; }
              // Absolute, native-separator path. File.Exists accepts a relative
              // forward-slash path on Windows but CreateProcess does not, so
              // Process.Start would throw Win32Exception(2) "file not found" on a
              // path that the check above just confirmed exists.
              exe = Path.GetFullPath(exe);

              var wall = new List<double>(runs);
              double cpu = 0;
              for (int i = 0; i < Warmup + runs; i++)
              {
                  var psi = new ProcessStartInfo(exe)
                  {
                      RedirectStandardOutput = true,
                      RedirectStandardError = true,
                      UseShellExecute = false,
                  };
                  if (arg is not null) psi.ArgumentList.Add(arg);
                  var sw = Stopwatch.StartNew();
                  using var p = Process.Start(psi)!;
                  // Drain before waiting: a full pipe buffer would deadlock.
                  p.StandardOutput.ReadToEnd();
                  p.StandardError.ReadToEnd();
                  p.WaitForExit();
                  sw.Stop();
                  if (i < Warmup) continue;          // discard: first spawns pay page-cache misses
                  wall.Add(sw.Elapsed.TotalMilliseconds);
                  // Child CPU after exit: TOTAL cpu for the whole run, not the
                  // pre-Main slice. Read it as "how much of the wall time was work
                  // at all" — wall >> cpu means the process spent its life blocked
                  // (a process-creation filter driver will do that), wall ~= cpu
                  // means it was genuinely busy. Do NOT compare this against the
                  // local ~0.00 ms figure in profiling-notes.md: that one was read
                  // at Main entry and covers only pre-Main, a different window.
                  try { cpu += p.TotalProcessorTime.TotalMilliseconds; } catch { }
              }
              wall.Sort();
              string cpuTxt = cpu > 0
                  ? (cpu / wall.Count).ToString("N2", CultureInfo.InvariantCulture)
                  : "n/a";
              Console.WriteLine($"{label,-22} {wall[0],8:N2} {wall[wall.Count / 2],8:N2} "
                  + $"{wall[(int)(wall.Count * 0.9)],8:N2} {cpuTxt,8}");
          }
          CS
          dotnet build probe/spawn/spawn.csproj -c Release -o probe/spawn-out

      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          EXT=""; [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          TARGETS="claudinine=publish/${{ matrix.rid }}/claudinine${EXT}::version"
          TARGETS="$TARGETS empty-aot=probe/tinyexe-out/tinyexe${EXT}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # No guaranteed C compiler on the Windows images; `where.exe` is the
            # closest equivalent to a trivial native exe, and it is what showed
            # 47 ms locally.
            TARGETS="$TARGETS native-sys=$SYSTEMROOT/System32/where.exe::nonexistent-xyz"
          else
            TARGETS="$TARGETS native-c=probe/tiny-native"
          fi
          echo "=== ${{ matrix.rid }} on ${{ matrix.os }} (${{ runner.arch }}) ==="
          echo "runs=${{ inputs.runs }} (plus 20 discarded warm-up spawns per target)"
          ./probe/spawn-out/spawn${EXT} "${{ inputs.runs }}" $TARGETS
          echo
          echo "binary size:"
          ls -l "publish/${{ matrix.rid }}/claudinine${EXT}" | awk '{print "  claudinine: " $5 " bytes"}'
          ls -l "probe/tinyexe-out/tinyexe${EXT}" | awk '{print "  empty-aot : " $5 " bytes"}'
