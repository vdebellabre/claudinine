name: Commit validation

# Continuous integration: compile the six-RID matrix and run the tests on every
# push to main (the only branch -- development happens there directly) and on
# any PR targeting it. Publishes nothing -- releasing is cd.yml, a manual
# dispatch whose release commit does NOT re-trigger this: it is pushed with
# GITHUB_TOKEN, whose pushes never fire workflows, and touches only manifests
# and the changelog anyway.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # Validation compiles and tests; it does not pack. The archive is packed and
    # verified on every release dispatch, which is the gate that matters.
    with:
      pack: false
