name: Commit validation

# Continuous integration: compile the six-RID matrix and run the tests on every
# push to develop, and on the PRs that gate main. Publishes nothing -- releasing
# is cd.yml, a manual dispatch that writes to main.
#
# `pull_request.branches` filters the BASE branch, so `main` is listed to cover
# the develop -> main PRs (the only way a workflow change reaches main, since
# workflow_dispatch reads its definition from the default branch). main is not a
# `push` trigger: it only ever receives commits from the release dispatch, via
# the app that the ruleset lets bypass it.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # Validation compiles and tests; it does not pack. The archive is packed and
    # verified on every release dispatch, which is the gate that matters.
    with:
      pack: false
