name: Commit validation

# Continuous integration: compile the six-RID matrix and run the tests on every
# PR targeting main. Publishes nothing -- releasing is cd.yml (dispatch ->
# release PR) plus cd-publish.yml (publish on merge). The release PR is a PR
# like any other, so this workflow is also what greens it.
#
# main has no `push` trigger: nothing lands on main outside a PR (the
# main-protect ruleset has no bypass actors), so every commit on main arrived
# with these checks already green.
#
# `ci-ok` exists solely to be the ruleset's required status check: requiring
# one stable name instead of the six matrix job names means a matrix change
# never silently drops a required check. `if: always()` is load-bearing -- a
# skipped job never reports its check, and a required check that never reports
# blocks the merge forever.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # Validation compiles and tests; it does not pack. The archive is packed and
    # verified on every release dispatch, which is the gate that matters.
    with:
      pack: false

  ci-ok:
    name: ci-ok
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build.result }}" = "success"
