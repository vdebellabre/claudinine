name: Publish release

# Continuous delivery: the only path that publishes. Manual dispatch, choosing
# which version component to bump.
#
# Branch model: develop is where all development happens; main is CD's output
# only, and a ruleset restricts pushes to main to the publish GitHub App (see
# PUBLISH_APP_ID / PUBLISH_APP_PEM). Nothing else -- not even repo admins by
# default -- can commit to main. This exists so main can be pinned as the
# marketplace's ref while still being the branch CD writes its own release
# commit to: main never carries hand-written commits, so there is no tree it
# needs to reconcile with.
#
# Because the new version is COMPUTED from the dropdown rather than supplied, a
# release run cannot target a version that already shipped -- there is no input
# that could name one.
#
# Ordering: checkout develop -> compute the version -> build an archive
# carrying it (UNCOMMITTED) -> commit the bump and pin on top of develop's tree
# -> push that commit and its tag to main -> publish. Everything fallible
# happens before the first write, so a build, pack or republish-check failure
# leaves main exactly as it was -- the release commit is never pushed for a
# release that did not get that far.
#
# Only the asset upload sits after the push, and it is recoverable in place:
# commit and tag are already correct, so re-running the release job attaches the
# asset to the existing tag without a new version or a new build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which version component to bump'
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  # Computes the target version WITHOUT writing it. The build applies it to its
  # own checkout (see build.yml's `version` input), which is what keeps main
  # untouched until the release has published.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Compute next version
        id: next
        shell: pwsh
        env:
          # bump-version.ps1 calls `gh release list` to find the last released
          # version now that develop carries none in-tree; that call needs
          # this token to authenticate at all.
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = ./eng/bump-version.ps1 -Component '${{ inputs.bump }}' -WhatIf
          "version=$($r.Version)" >> $env:GITHUB_OUTPUT

      # Refuse early if the target release OR tag already exists: the version
      # was just computed from the dropdown, so a collision means the
      # invariant broke (a stale tag, or a prior run that tagged but failed to
      # publish, or two dispatches racing). Checking the tag too, not just the
      # release, matters in practice: a run that fails between `git tag` and
      # a successful `Publish release` leaves exactly a tag-with-no-release,
      # which the release-only check cannot see -- confirmed live, twice,
      # both times reproducing the identical "tag already exists" failure on
      # the next dispatch of the same version.
      - name: Refuse to republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.next.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; refusing to republish." \
                 "The bump should have produced an unused version -- check for a" \
                 "stale tag or a concurrent release run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists on origin with no matching" \
                 "release -- likely debris from a run that tagged but failed" \
                 "before publishing. Delete it (git push origin :refs/tags/$tag)" \
                 "and re-dispatch, or investigate why it was never cleaned up."
            exit 1
          fi

  # Same build CI runs, with the computed version written into the runner's tree
  # just before packing. Nothing is committed to produce this archive.
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      ref: develop
      version: ${{ needs.version.outputs.version }}

  release:
    name: release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          # checkout persists GITHUB_TOKEN as the remote credential by default,
          # which would shadow the App token this job actually needs to push
          # with. Disabled so `gh auth setup-git` (below, once the App token
          # exists) is the only credential helper git sees.
          persist-credentials: false

      # Every PR merge into main (the bootstrap workflow-sync PRs, and any
      # future one) adds a merge commit that develop never gets -- so main's
      # tip is routinely AHEAD of develop by commits develop doesn't have,
      # even though develop is always an ancestor of main. Building the
      # release commit on develop's tip and pushing to main is therefore not
      # a fast-forward from main's actual current position (confirmed: exit
      # 128 "Updates were rejected... behind its remote counterpart" on a
      # real dispatch). Rebasing the checkout onto main's tip first makes the
      # new commit's parent main's real tip, so the push is a genuine
      # fast-forward -- develop's file contents, main's history.
      - name: Rebase checkout onto main's current tip
        run: |
          git fetch origin main
          git checkout -B release-base origin/main
          # `checkout <ref> -- .` overlays develop's tree onto main's; it does
          # NOT remove a file that exists on main but not on develop. Verified
          # empty today (nothing is main-only, since main only ever receives
          # commits from this job) -- if that ever stops holding, this needs
          # `git diff --name-only --diff-filter=D origin/main develop | xargs
          # -r git rm` added alongside it.
          git checkout develop -- .
          git status --short

      # main is restricted (ruleset: "restrict who can push") to this App --
      # not to github-actions[bot], which cannot be named in that list at all,
      # by GitHub's own design: it is the same identity for every workflow on
      # every branch, so naming it would let any workflow on any branch push to
      # main. The App's identity is specific to this installation, so it can be
      # named without opening that hole.
      - name: Mint publish-app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: claudinine

      # TEMPORARY: the main ruleset's bypass_actors entry needs this
      # installation-id, not the app-id -- GitHub's ruleset docs don't say
      # which one a bypass actor_id means, and app-id got rejected by the
      # ruleset in practice. Remove this step once the ruleset is confirmed
      # working with the right id.
      - name: Debug -- print installation id
        run: echo "installation-id=${{ steps.app-token.outputs.installation-id }}"

      # Points git's credential helper at `gh`, which reads GH_TOKEN -- the
      # documented way to authenticate a plain `git push` with a minted App
      # token (actions/create-github-app-token's own README). Simpler and less
      # error-prone than hand-building an Authorization header.
      - name: Point git at the app token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - uses: actions/download-artifact@v8
        with:
          name: claudinine-archive
          path: artifacts

      # Confirm the payloads exist before anything irreversible.
      - name: Check archives present
        run: |
          zip="artifacts/${{ needs.build.outputs.zip }}"
          plugin="artifacts/${{ needs.build.outputs.plugin }}"
          test -f "$zip" || { echo "::error::archive $zip missing"; exit 1; }
          test -f "$plugin" || { echo "::error::hosted bundle $plugin missing"; exit 1; }

      # Record the release in one commit: the version bump the build packed
      # (uncommitted there, so replayed here) plus the digest of the archive that
      # is about to be published. Both must be in the TAGGED commit, so this runs
      # before the tag. The pin is gated on the marketplace already using an
      # archive source: on a relative-path source there is nothing to pin.
      - name: Commit bump and pin
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          ./eng/set-version.ps1 -Version $version

          # Renames `## Unreleased` to this version and reopens an empty slot
          # above it, so the release commit records the notes that shipped and
          # develop starts the next cycle clean. Throws when the section is
          # empty -- deliberately, since a release with blank notes is the
          # failure this exists to prevent. Nothing has been pushed yet at
          # this point, so the fix is to write the section and re-dispatch.
          ./eng/release-notes.ps1 -Version $version -Promote | Out-Null

          $m = Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json
          $src = ($m.plugins | Where-Object { $_.name -eq 'claudinine' }).source
          if ($src -isnot [string] -and $src.source -eq 'archive') {
            ./eng/set-archive-source.ps1 -Sha256 '${{ needs.build.outputs.sha256 }}' -Version $version
          } else {
            Write-Host 'marketplace on relative-path source; skipping digest pin'
          }

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/plugin.json src/Claudinine/Claudinine.csproj .claude-plugin/marketplace.json CHANGELOG.md
          if (git diff --cached --quiet) { throw 'release produced no change to commit' }
          git commit -m "Release $version"

      # develop's tip plus this commit becomes main's tip -- not a merge, a
      # fast-forward-shaped push of a single new commit onto a branch that only
      # this App can write to. main never carries hand-written commits, so
      # there is never a tree on main that this push needs to reconcile with.
      #
      # main and the tag go up together by explicit refspec. The tag is
      # annotated because --follow-tags silently skips lightweight tags, which
      # left the tag runner-local while main advanced (verified locally).
      #
      # This is the first irreversible step. Everything fallible before it -- the
      # six-RID build, the pack, the republish check -- has already passed, and
      # the archive is sitting in the artifact store. If the upload below fails,
      # the commit and tag are already correct: re-run this job to attach the
      # asset to the existing tag, without a new version or a new build.
      - name: Push release commit and tag to main
        env:
          # gh auth setup-git (above) configured the credential helper to
          # delegate to `gh auth git-credential`, but that helper itself reads
          # GH_TOKEN from ITS OWN step's environment when git invokes it --
          # env vars do not carry over between steps, so this push failed with
          # "could not read Username" until the token was repeated here too.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version='${{ needs.version.outputs.version }}'
          git tag -a "v$version" -m "v$version"
          git push origin "HEAD:main" "refs/tags/v$version"

      # Create the release FROM the pushed tag: `gh release create --target`
      # would create the tag server-side itself, and a subsequent tag push is
      # then rejected as already-existing (verified locally). Pushing first
      # leaves gh one job, and keeps the tag pointing at the release commit.
      #
      # Uses the same App token, not github.token: the release/tag object this
      # creates belongs to the same identity that pushed main, and the App's
      # `contents: write` permission covers it -- no extra scope needed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          version='${{ needs.version.outputs.version }}'
          tag="v$version"
          zip="artifacts/${{ needs.build.outputs.zip }}"
          plugin="artifacts/${{ needs.build.outputs.plugin }}"
          # Section first, boilerplate last. The promote step above already
          # renamed the heading in this checkout, so this reads the section
          # under its final version name.
          pwsh -File eng/release-notes.ps1 -Version "$version" > notes.md
          printf '\n---\nPlugin archive for `archive`-source installs (`.zip`, sha256 `%s`) and hosted bundle for claude.ai account upload (`.plugin`).\n' \
            '${{ needs.build.outputs.sha256 }}' >> notes.md
          gh release create "$tag" "$zip" "$plugin" --title "$tag" --notes-file notes.md
          echo "asset URLs: $(gh release view "$tag" --json assets --jq '.assets[].url')"
