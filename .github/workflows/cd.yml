name: cd

# Continuous delivery: the only path that publishes. Manual dispatch, choosing
# which version component to bump.
#
# Because the new version is COMPUTED from the dropdown rather than supplied, a
# release run cannot target a version that already shipped -- there is no input
# that could name one.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which version component to bump'
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  # The bump lands as a commit BEFORE the build, because the packed archive
  # carries the version and build.yml checks out a ref rather than inheriting a
  # dirty tree. Building the bump commit also means the tag published below
  # points at a tree that already states the released version.
  #
  # The digest pin is not known yet (it depends on the archive this commit
  # produces), so it is amended into this same commit by the release job, which
  # then tags it. Nothing is pushed until the archive exists.
  bump:
    name: bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $r = ./eng/bump-version.ps1 -Component '${{ inputs.bump }}'
          "version=$($r.Version)" >> $env:GITHUB_OUTPUT

      # Committed locally and left unpushed: the release job amends the digest
      # pin in, and an unpushed commit keeps a failed run from leaving a bumped
      # version on main with no release behind it.
      - name: Commit bump
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/plugin.json src/Claudinine/Claudinine.csproj
          git diff --cached --quiet && { echo '::error::bump produced no change'; exit 1; }
          git commit -m "Release ${{ steps.bump.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git bundle create bump.bundle HEAD

      # The commit exists only in this runner, so hand it to the next jobs as a
      # bundle rather than pushing it.
      - uses: actions/upload-artifact@v7
        with:
          name: bump-commit
          path: bump.bundle
          if-no-files-found: error

  # Same build CI runs, against the bumped tree.
  build:
    needs: bump
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  release:
    name: release
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: bump-commit
          path: bundle

      - uses: actions/download-artifact@v8
        with:
          name: claudinine-archive
          path: artifacts

      # Restore the unpushed bump commit and stand on it.
      - name: Restore bump commit
        run: |
          git fetch bundle/bump.bundle HEAD
          git checkout --detach ${{ needs.bump.outputs.sha }}

      # An existing tag here is not user error -- the version was just computed
      # from the dropdown, so it cannot name an existing release. It means the
      # invariant broke (a stale tag, or a prior run that tagged but failed to
      # publish, or two dispatches racing). Fail loudly rather than overwrite:
      # silently re-uploading is what let a published asset drift from the
      # digest pinned in marketplace.json. The zip is not byte-reproducible, so
      # any re-upload changes the digest.
      - name: Refuse to republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.bump.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; refusing to republish." \
                 "The bump should have produced an unused version -- check for a" \
                 "stale tag or a concurrent release run."
            exit 1
          fi

      # Amend the digest pin into the bump commit, so the tag and main never
      # disagree about which digest is pinned. Gated on the marketplace already
      # using an archive source: on a relative-path source there is nothing to
      # pin.
      - name: Pin archive digest
        shell: pwsh
        run: |
          $version = '${{ needs.bump.outputs.version }}'
          $m = Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json
          $src = ($m.plugins | Where-Object { $_.name -eq 'claudinine' }).source
          if ($src -isnot [string] -and $src.source -eq 'archive') {
            ./eng/set-archive-source.ps1 -Sha256 '${{ needs.build.outputs.sha256 }}' -Version $version
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add .claude-plugin/marketplace.json
            if (git diff --cached --quiet) {
              Write-Host 'pin already current'
            } else {
              git commit --amend --no-edit
            }
          } else {
            Write-Host 'marketplace on relative-path source; skipping digest pin'
          }

      # Confirm the payload exists before touching main: everything after this
      # point is hard to unwind.
      - name: Check archive present
        run: |
          zip="artifacts/${{ needs.build.outputs.zip }}"
          test -f "$zip" || { echo "::error::archive $zip missing"; exit 1; }

      # main and the tag go up together by explicit refspec. The tag is
      # annotated because --follow-tags silently skips lightweight tags, which
      # left the tag runner-local while main advanced (verified locally).
      - name: Push release commit and tag
        run: |
          version='${{ needs.bump.outputs.version }}'
          git tag -a "v$version" -m "v$version"
          git push origin "HEAD:main" "refs/tags/v$version"

      # Create the release FROM the pushed tag: `gh release create --target`
      # would create the tag server-side itself, and the subsequent tag push is
      # then rejected as already-existing (verified locally), failing the run
      # after main had already moved. Pushing first leaves gh one job.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.bump.outputs.version }}'
          tag="v$version"
          zip="artifacts/${{ needs.build.outputs.zip }}"
          printf 'Plugin archive for `archive`-source installs.\n\nsha256: `%s`\n' \
            '${{ needs.build.outputs.sha256 }}' > notes.md
          gh release create "$tag" "$zip" --title "$tag" --notes-file notes.md
          echo "asset URL: $(gh release view "$tag" --json assets --jq '.assets[].url')"
