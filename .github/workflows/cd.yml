name: Publish release

# Continuous delivery: the only path that publishes. Manual dispatch, choosing
# which version component to bump.
#
# Branch model: single branch. main is where all development happens, and CD
# writes exactly one commit per release on top of it: the version stamps, the
# marketplace pin for the new archive, and the changelog promotion. Between
# releases the manifests keep the PREVIOUS release's values, which are always a
# valid install target -- the marketplace pointer only ever moves inside a
# release commit. Tags are the released snapshots; a ruleset (main-protect)
# blocks deletion and force-push but ordinary pushes are open.
#
# Because the new version is COMPUTED from the dropdown rather than supplied, a
# release run cannot target a version that already shipped -- there is no input
# that could name one.
#
# Ordering: checkout the dispatched commit -> compute the version -> build an
# archive carrying it (UNCOMMITTED) -> commit the bump, pin and changelog
# promotion on top -> push that commit and its tag to main -> publish.
# Everything fallible happens before the first write, so a build, pack or
# republish-check failure leaves main exactly as it was -- the release commit
# is never pushed for a release that did not get that far.
#
# All jobs check out the same snapshot (the dispatch SHA, actions/checkout's
# default), so a push to main mid-run cannot make the tag disagree with the
# built archive: the release push is a fast-forward of that SHA plus one
# commit, and a mid-run push makes it fail cleanly -- pull and re-dispatch.
#
# Only the asset upload sits after the push, and it is recoverable in place:
# commit and tag are already correct, so re-running the release job attaches the
# asset to the existing tag without a new version or a new build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which version component to bump'
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  # Computes the target version WITHOUT writing it. The build applies it to its
  # own checkout (see build.yml's `version` input), which is what keeps main
  # untouched until the release has published.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute next version
        id: next
        shell: pwsh
        env:
          # bump-version.ps1 calls `gh release list` to find the last released
          # version -- the tree's own version stamp is the PREVIOUS release's,
          # so it is never the source of truth; that call needs this token to
          # authenticate at all.
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = ./eng/bump-version.ps1 -Component '${{ inputs.bump }}' -WhatIf
          "version=$($r.Version)" >> $env:GITHUB_OUTPUT

      # Refuse early if the target release OR tag already exists: the version
      # was just computed from the dropdown, so a collision means the
      # invariant broke (a stale tag, or a prior run that tagged but failed to
      # publish, or two dispatches racing). Checking the tag too, not just the
      # release, matters in practice: a run that fails between `git tag` and
      # a successful `Publish release` leaves exactly a tag-with-no-release,
      # which the release-only check cannot see -- confirmed live, twice,
      # both times reproducing the identical "tag already exists" failure on
      # the next dispatch of the same version.
      - name: Refuse to republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.next.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; refusing to republish." \
                 "The bump should have produced an unused version -- check for a" \
                 "stale tag or a concurrent release run."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists on origin with no matching" \
                 "release -- likely debris from a run that tagged but failed" \
                 "before publishing. Delete it (git push origin :refs/tags/$tag)" \
                 "and re-dispatch, or investigate why it was never cleaned up."
            exit 1
          fi

  # Same build CI runs, with the computed version written into the runner's tree
  # just before packing. Nothing is committed to produce this archive.
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: release
    needs: [version, build]
    runs-on: ubuntu-latest
    # The push and the release upload both run as github-actions[bot] with the
    # workflow's own token -- the ruleset no longer restricts who can push to
    # main, so no App identity is needed. A side effect worth keeping: pushes
    # made with GITHUB_TOKEN do not trigger other workflows, so the release
    # commit does not spend a CI run on a manifests+changelog-only change.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: claudinine-archive
          path: artifacts

      # Confirm the payloads exist before anything irreversible.
      - name: Check archives present
        run: |
          zip="artifacts/${{ needs.build.outputs.zip }}"
          plugin="artifacts/${{ needs.build.outputs.plugin }}"
          test -f "$zip" || { echo "::error::archive $zip missing"; exit 1; }
          test -f "$plugin" || { echo "::error::hosted bundle $plugin missing"; exit 1; }

      # Record the release in one commit: the version bump the build packed
      # (uncommitted there, so replayed here) plus the digest of the archive that
      # is about to be published. Both must be in the TAGGED commit, so this runs
      # before the tag. The pin is gated on the marketplace already using an
      # archive source: on a relative-path source there is nothing to pin.
      - name: Commit bump and pin
        shell: pwsh
        run: |
          $version = '${{ needs.version.outputs.version }}'
          ./eng/set-version.ps1 -Version $version

          # Renames `## Unreleased` to this version and reopens an empty slot
          # above it, so the release commit records the notes that shipped and
          # the next cycle starts clean. Throws when the section is empty --
          # deliberately, since a release with blank notes is the failure this
          # exists to prevent. Nothing has been pushed yet at this point, so
          # the fix is to write the section on main and re-dispatch.
          ./eng/release-notes.ps1 -Version $version -Promote | Out-Null

          $m = Get-Content .claude-plugin/marketplace.json -Raw | ConvertFrom-Json
          $src = ($m.plugins | Where-Object { $_.name -eq 'claudinine' }).source
          if ($src -isnot [string] -and $src.source -eq 'archive') {
            ./eng/set-archive-source.ps1 -Sha256 '${{ needs.build.outputs.sha256 }}' -Version $version
          } else {
            Write-Host 'marketplace on relative-path source; skipping digest pin'
          }

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/plugin.json src/Claudinine/Claudinine.csproj .claude-plugin/marketplace.json CHANGELOG.md
          if (git diff --cached --quiet) { throw 'release produced no change to commit' }
          git commit -m "Release $version"

      # The dispatched snapshot plus this commit becomes main's tip -- a
      # fast-forward as long as nothing was pushed to main since the dispatch.
      # If something was, this fails cleanly and the right move is to
      # re-dispatch (retrying by rebasing here would tag a tree the archive
      # was not built from).
      #
      # main and the tag go up together by explicit refspec. The tag is
      # annotated because --follow-tags silently skips lightweight tags, which
      # left the tag runner-local while main advanced (verified locally).
      #
      # This is the first irreversible step. Everything fallible before it -- the
      # six-RID build, the pack, the republish check -- has already passed, and
      # the archive is sitting in the artifact store. If the upload below fails,
      # the commit and tag are already correct: re-run this job to attach the
      # asset to the existing tag, without a new version or a new build.
      - name: Push release commit and tag to main
        run: |
          version='${{ needs.version.outputs.version }}'
          git tag -a "v$version" -m "v$version"
          git push origin "HEAD:main" "refs/tags/v$version"

      # Create the release FROM the pushed tag: `gh release create --target`
      # would create the tag server-side itself, and a subsequent tag push is
      # then rejected as already-existing (verified locally). Pushing first
      # leaves gh one job, and keeps the tag pointing at the release commit.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.version.outputs.version }}'
          tag="v$version"
          zip="artifacts/${{ needs.build.outputs.zip }}"
          plugin="artifacts/${{ needs.build.outputs.plugin }}"
          # Section first, boilerplate last. The promote step above already
          # renamed the heading in this checkout, so this reads the section
          # under its final version name.
          pwsh -File eng/release-notes.ps1 -Version "$version" > notes.md
          printf '\n---\nPlugin archive for `archive`-source installs (`.zip`, sha256 `%s`) and hosted bundle for claude.ai account upload (`.plugin`).\n' \
            '${{ needs.build.outputs.sha256 }}' >> notes.md
          gh release create "$tag" "$zip" "$plugin" --title "$tag" --notes-file notes.md
          echo "asset URLs: $(gh release view "$tag" --json assets --jq '.assets[].url')"
