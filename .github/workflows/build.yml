name: build

# Reusable build: the six-RID matrix plus the packed archive, shared by ci.yml
# (push / PR) and cd.yml (release dispatch) so the release ships exactly what CI
# validated, from one definition. Publishes nothing and knows nothing about
# releases -- cd.yml consumes the outputs below.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build. Defaults to the caller''s ref.'
        required: false
        type: string
      # Lets cd.yml build a version that is not committed anywhere yet: the
      # archive must carry its own version (the packer reads the manifest for
      # both the zip name and the manifest inside it), and a reusable workflow
      # checks out from the REMOTE, so it cannot see an uncommitted bump. With
      # this input the version is written into the runner's tree just before
      # packing, so nothing has to be pushed in order to build it.
      version:
        description: 'Override the manifest version before packing. Defaults to the version already in the tree.'
        required: false
        type: string
      # Validation (push / PR) only needs the matrix to compile and the tests to
      # pass: the packing half is a zip plus an upload over inputs that a source
      # change cannot alter, so it is dead weight on every develop push. It still
      # runs on every release dispatch, which is the gate that matters -- but that
      # means a regression in pack-plugin.ps1 or eng/shims/ now surfaces at
      # release time rather than at PR time.
      pack:
        description: 'Pack and verify the archive. Release dispatch needs it; validation does not.'
        required: false
        default: true
        type: boolean
    outputs:
      version:
        description: 'Plugin version taken from the manifest at the built ref.'
        value: ${{ jobs.package.outputs.version }}
      sha256:
        description: 'SHA-256 of the packed archive.'
        value: ${{ jobs.package.outputs.sha256 }}
      zip:
        description: 'CLI archive file name, claudinine-<version>.zip (no directory).'
        value: ${{ jobs.package.outputs.zip }}
      plugin:
        description: 'Hosted bundle file name, claudinine-<version>.plugin (no directory).'
        value: ${{ jobs.package.outputs.plugin }}

jobs:
  publish:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-arm }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          # macos-13 was retired (a job targeting it queues forever);
          # macos-15-intel is GitHub's last Intel image, kept until ~2027.
          - { rid: osx-x64,     os: macos-15-intel }
          - { rid: osx-arm64,   os: macos-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # src/global.json is the single source of truth for the SDK: it pins
      # 10.0.302 with rollForward latestMinor, so the build takes the newest 10.x
      # present and can never silently move to 11.x. setup-dotnet installs that
      # exact build; the runner images also carry newer 10.x SDKs, which the
      # roll-forward then picks up (verified on all six legs: pinning 10.0.100
      # resolved to 10.0.302).
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      # Every dotnet command runs from src/: global.json lives there (SDK + the
      # Microsoft.Testing.Platform runner opt-in) and is discovered by walking up
      # from the working directory, not from the project file.
      - name: Test
        working-directory: src
        run: dotnet test Claudinine.Tests/Claudinine.Tests.csproj

      # Native AOT cannot cross-compile across OSes: this matrix IS the
      # release build. Publishing on every push is the early warning for
      # any trim/AOT-unfriendly change.
      # Target the csproj, not the directory: the directory resolves to
      # Claudinine.slnx, which also carries the test project. That project is an
      # exe (Microsoft.Testing.Platform) and a non-self-contained exe cannot
      # reference this self-contained one — NETSDK1151.
      # -o is relative to working-directory, so ../ keeps the binaries at the repo
      # root where the smoke tests and upload-artifact below expect them.
      # -p:Version bakes the release version into the assembly itself -- the
      # `Apply version override` in the package job below runs AFTER this
      # compile and only reaches the manifest, so without this flag every
      # released binary reported the SDK default via `claudinine version`.
      - name: Publish (Native AOT)
        working-directory: src
        run: dotnet publish Claudinine/Claudinine.csproj -c Release -r ${{ matrix.rid }} -o ../publish/${{ matrix.rid }} ${{ inputs.version != '' && format('-p:Version={0}', inputs.version) || '' }}

      # The version assertion only fires on release builds (`version` input
      # set): a validation build has no override, so the binary legitimately
      # reports the SDK default there.
      - name: Smoke test
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          got="$(./publish/${{ matrix.rid }}/claudinine version)"
          echo "claudinine version -> $got"
          if [ -n "${{ inputs.version }}" ] && [ "$got" != "${{ inputs.version }}" ]; then
            echo "binary reports $got but this build was dispatched for ${{ inputs.version }}"; exit 1
          fi
          echo '{"hook_event_name":"SessionStart","transcript_path":"/nonexistent"}' | ./publish/${{ matrix.rid }}/claudinine hook

      - name: Smoke test (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: |
          $got = ./publish/${{ matrix.rid }}/claudinine.exe version
          Write-Host "claudinine version -> $got"
          if ('${{ inputs.version }}' -and $got -ne '${{ inputs.version }}') {
            throw "binary reports $got but this build was dispatched for ${{ inputs.version }}"
          }
          '{"hook_event_name":"SessionStart","transcript_path":"C:\\nonexistent"}' | ./publish/${{ matrix.rid }}/claudinine.exe hook

      # Ship the binary only. `claudinine*` also matched the stripped symbol
      # files (claudinine.dbg / .pdb), which are bigger than the binary and are
      # never committed to bin/<rid>/.
      #
      # These artifacts exist solely to feed the package job, so skip the upload
      # when nothing will consume them -- this is most of what validation saves.
      - if: inputs.pack
        uses: actions/upload-artifact@v7
        with:
          name: claudinine-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/claudinine
            publish/${{ matrix.rid }}/claudinine.exe
          if-no-files-found: error

  # Packages the six binaries as one zip for `archive`-source distribution, so
  # installing the plugin does not require cloning this repo (whose .git carries
  # every binary ever shipped).
  #
  # Runs on Linux for the `zip` CLI: it stores Unix permission bits, which
  # Compress-Archive does not, and the shim plus the five POSIX binaries must
  # extract executable.
  package:
    name: package
    needs: publish
    if: inputs.pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      zip: ${{ steps.pack.outputs.zip }}
      plugin: ${{ steps.pack.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: claudinine-*
          merge-multiple: false

      # download-artifact names each directory claudinine-<rid>; pack-plugin
      # expects <rid> directly under -BinRoot.
      - name: Reshape artifact layout
        run: |
          mkdir -p bins
          for d in dl/claudinine-*/; do
            rid="$(basename "$d" | sed 's/^claudinine-//')"
            mkdir -p "bins/$rid"
            cp "$d"/claudinine "bins/$rid/" 2>/dev/null || true
            cp "$d"/claudinine.exe "bins/$rid/" 2>/dev/null || true
          done
          ls -R bins

      # Uncommitted on purpose -- see the `version` input. cd.yml commits this
      # same write only after the release has been published.
      - name: Apply version override
        if: inputs.version != ''
        shell: pwsh
        run: |
          ./eng/set-version.ps1 -Version '${{ inputs.version }}'

      - name: Pack
        id: pack
        shell: pwsh
        run: |
          $r = ./eng/pack-plugin.ps1 -BinRoot bins -OutDir artifacts
          if ($r.Bits -ne 'preserved') { throw "executable bits were not stored: $($r.Bits)" }
          $h = ./eng/pack-plugin.ps1 -BinRoot bins -OutDir artifacts -Hosted
          if ($h.Bits -ne 'preserved') { throw "hosted: executable bits were not stored: $($h.Bits)" }
          # $r.Zip is an absolute path; publish the bare file name so callers can
          # join it onto wherever they downloaded the artifact.
          "version=$($r.Version)"                  >> $env:GITHUB_OUTPUT
          "sha256=$($r.Sha256)"                    >> $env:GITHUB_OUTPUT
          "zip=$(Split-Path -Leaf $r.Zip)"         >> $env:GITHUB_OUTPUT
          "plugin=$(Split-Path -Leaf $h.Zip)"      >> $env:GITHUB_OUTPUT
          Write-Host "packed $($r.Zip) ($($r.SizeMB) MB) sha256=$($r.Sha256)"
          Write-Host "packed $($h.Zip) ($($h.SizeMB) MB) sha256=$($h.Sha256)"

      # The archives are the install payloads, so verify the bits survived a
      # real round-trip rather than trusting the packer.
      - name: Verify archive
        run: |
          cd artifacts
          unzip -q -o "claudinine-${{ steps.pack.outputs.version }}.zip" -d verify
          test -x verify/libexec/claudinine || { echo "shim not executable after extract"; exit 1; }
          test -x verify/bin/claudinine || { echo "bin forwarder not executable after extract"; exit 1; }
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            test -x "verify/libexec/$rid/claudinine" || { echo "$rid binary not executable"; exit 1; }
          done
          test -f verify/.claude-plugin/plugin.json || { echo "manifest not at archive root"; exit 1; }
          # On a release build the binary must report the packed version -- this
          # is the assertion that catches a binary compiled before (or without)
          # the version override. Skipped on versionless packs, where the
          # manifest has no version and pack-plugin falls back to 'dev'.
          got="$(./verify/libexec/linux-x64/claudinine version)"
          if [ -n "${{ inputs.version }}" ] && [ "$got" != "${{ steps.pack.outputs.version }}" ]; then
            echo "binary reports $got, package is ${{ steps.pack.outputs.version }}"; exit 1
          fi
          ./verify/bin/claudinine version
          echo "CLI archive verified"

      # The claude.ai validator refuses any hosted plugin with a top-level
      # bin/ (measured 2026-08-15). This assertion is what would have caught
      # that before an upload attempt -- it must never be removed.
      - name: Verify hosted bundle
        run: |
          cd artifacts
          unzip -q -o "claudinine-${{ steps.pack.outputs.version }}.plugin" -d verify-hosted
          test ! -e verify-hosted/bin || { echo "hosted bundle contains a top-level bin/ -- the claude.ai validator will refuse it"; exit 1; }
          test -x verify-hosted/libexec/claudinine || { echo "shim not executable after extract"; exit 1; }
          # ALL SIX RIDs must ship: cloud sessions are Linux, but the same
          # account artifact feeds local ("On your computer") Cowork, where
          # hooks execute on the desktop host -- a missing host RID kills every
          # hook with exit 127 (measured 2026-08-15 on Windows, docs/cowork.md
          # O12). A Linux-only hosted bundle is the regression to catch now.
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            test -x "verify-hosted/libexec/$rid/claudinine" || { echo "$rid binary not executable"; exit 1; }
          done
          for rid in win-x64 win-arm64; do
            test -f "verify-hosted/libexec/$rid/claudinine.exe" || { echo "$rid binary missing"; exit 1; }
          done
          test -f verify-hosted/libexec/claudinine.cmd || { echo "hosted bundle missing the Windows shim for Git-Bash-less hosts"; exit 1; }
          test -f verify-hosted/.claude-plugin/plugin.json || { echo "manifest not at bundle root"; exit 1; }
          got="$(./verify-hosted/libexec/linux-x64/claudinine version)"
          if [ -n "${{ inputs.version }}" ] && [ "$got" != "${{ steps.pack.outputs.version }}" ]; then
            echo "binary reports $got, package is ${{ steps.pack.outputs.version }}"; exit 1
          fi
          echo "hosted bundle verified"

      # The packed archives are what cd.yml publishes: hand them over as an
      # artifact so the release ships these exact bytes. The zip is not
      # byte-reproducible across builds, so re-packing in the release job would
      # produce a different digest than the one CI verified.
      - uses: actions/upload-artifact@v7
        with:
          name: claudinine-archive
          path: |
            artifacts/${{ steps.pack.outputs.zip }}
            artifacts/${{ steps.pack.outputs.plugin }}
          if-no-files-found: error
